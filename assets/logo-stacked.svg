<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 196" role="img" aria-label="Data Insights North West, by Aaron Chadburn">
  <title>Data Insights North West — by Aaron Chadburn</title>
  <!-- STACKED lockup: emblem above the name, byline underneath.
       Use this in a square or portrait space — social avatars, invoice
       headers, business cards, anything printed. For the website header and
       other wide spaces use logo.svg.

       Wordmark is live <text> and depends on the brand fonts; use
       assets/logo-stacked.png externally. -->
  <g transform="translate(98,6) scale(2.625)">
    <circle cx="16" cy="16" r="16" fill="#0E1A24"/>
    <g stroke="#5B7382" stroke-width="1.5" fill="none">
      <rect x="7.5" y="8.5" width="17" height="15" rx="1.4"/>
      <path d="M16 8.5v15M7.5 16h17"/>
    </g>
    <polyline points="9.5,20 14,15 18.5,17.5 23,10.5"
              fill="none" stroke="#2FB574" stroke-width="3.1"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="23" cy="10.5" r="3" fill="#F2C24B"/>
  </g>

  <text x="140" y="133" text-anchor="middle"
        font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif"
        font-size="22" font-weight="700" letter-spacing="-.62" fill="#0E1A24">Data Insights North West</text>
  <rect x="122" y="145" width="36" height="2" rx="1" fill="#C9A24A"/>
  <text x="140" y="166" text-anchor="middle"
        font-family="Inter,'Segoe UI',system-ui,sans-serif"
        font-size="13" font-weight="400" fill="#6E7F86">by Aaron Chadburn</text>
</svg>
