<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="robots" content="{{ROBOTS}}">

<!-- Open Graph / Twitter. Without these, every link shared on LinkedIn,
     WhatsApp or Slack renders as a bare grey box. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Data Insights North West">
<meta property="og:locale" content="en_GB">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Data Insights North West — Power BI and Excel reporting, automation and data analysis">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">

<meta name="theme-color" content="#0E1A24">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/app-icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "@id": "https://datainsightsnorthwest.co.uk/#business",

  "url": "https://datainsightsnorthwest.co.uk/",
  "email": "enquiries@datainsightsnorthwest.co.uk",
  "logo": "https://datainsightsnorthwest.co.uk/assets/logo-lockup.png",
  "image": "https://datainsightsnorthwest.co.uk/assets/social-card.png",
  "founder": { "@type": "Person", "name": "Aaron Chadburn" },
  "areaServed": [
    { "@type": "AdministrativeArea", "name": "Merseyside" },
    { "@type": "AdministrativeArea", "name": "North West England" },
    { "@type": "Country", "name": "United Kingdom" }
  ],
  "knowsAbout": ["Power BI", "Microsoft Excel", "Data analysis", "Report automation", "Data reconciliation", "Data consolidation", "SQL", "Business intelligence"],
