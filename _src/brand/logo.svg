<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-label="Data Insights North West">
  <title>Data Insights North West</title>
  <!-- Primary horizontal lockup: the "W" mark + a two-line wordmark.
       The mark is the W of "North West" drawn as a data line, sitting on a gold
       axis rule — so it reads as the name and as a chart at the same time.

       NOTE: the wordmark here is live <text>, so it depends on Space Grotesk and
       Inter being installed on the viewer's machine. For anything external
       (directories, invoices, email signatures) use assets/logo-lockup.png,
       which has the fonts baked in. -->
  <polyline points="8,22 16,42 24,29 32,42.5 40,17"
            fill="none" stroke="#0F7A52" stroke-width="3.9"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="6.5" y="46.5" width="35" height="2.7" rx="1.35" fill="#C9A24A"/>

  <text x="56" y="34"
        font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif"
        font-size="21" font-weight="700" letter-spacing="-.55" fill="#0E1A24">Data Insights</text>
  <rect x="57" y="40" width="14" height="1.6" rx=".8" fill="#C9A24A" opacity=".9"/>
  <text x="76" y="45"
        font-family="Inter,'Segoe UI',system-ui,sans-serif"
        font-size="10.5" font-weight="600" letter-spacing="2.6" fill="#0F7A52">NORTH WEST</text>
</svg>
