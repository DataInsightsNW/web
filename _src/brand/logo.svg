<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-label="Data Insights North West">
  <title>Data Insights North West</title>
  <!-- Horizontal lockup: mark + two-line wordmark.
       "Data Insights" carries the weight; "NORTH WEST" is letterspaced small caps
       under a rule, which stops the name reading as one long bold run-on. -->
  <rect x="4" y="16" width="32" height="32" rx="7.5" fill="#0E1A24"/>
  <rect x="10"   y="42.6" width="20"  height="1.2"  rx=".6"  fill="#fff" opacity=".18"/>
  <rect x="10"   y="34"   width="5"   height="8"    rx="1.5" fill="#2FB574"/>
  <rect x="17.5" y="28.5" width="5"   height="13.5" rx="1.5" fill="#2FB574"/>
  <rect x="25"   y="23"   width="5"   height="19"   rx="1.5" fill="#F2C24B"/>

  <text x="50" y="34"
        font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif"
        font-size="21" font-weight="700" letter-spacing="-.55" fill="#0E1A24">Data Insights</text>
  <rect x="51" y="40" width="14" height="1.6" rx=".8" fill="#C9A24A" opacity=".9"/>
  <text x="70" y="45"
        font-family="Inter,'Segoe UI',system-ui,sans-serif"
        font-size="10.5" font-weight="600" letter-spacing="2.6" fill="#0F7A52">NORTH WEST</text>
</svg>
