<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Data Insights North West">
  <title>Data Insights North West</title>
  <!-- Mark: three ascending bars on an ink tile.
       Geometry is symmetric on purpose — bars span x 6..26 inside a 32 grid,
       so there is 6px of clear space each side and the mark still reads at 16px.
       The gold bar is the apex, not decoration: green builds, gold is the result. -->
  <rect width="32" height="32" rx="7.5" fill="#0E1A24"/>
  <rect x="6"    y="26.6" width="20"  height="1.2"  rx=".6"  fill="#fff" opacity=".18"/>
  <rect x="6"    y="18"   width="5"   height="8"    rx="1.5" fill="#2FB574"/>
  <rect x="13.5" y="12.5" width="5"   height="13.5" rx="1.5" fill="#2FB574"/>
  <rect x="21"   y="7"    width="5"   height="19"   rx="1.5" fill="#F2C24B"/>
</svg>
